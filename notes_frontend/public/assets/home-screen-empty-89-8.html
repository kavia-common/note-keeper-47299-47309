<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Screen Empty - 89:8</title>
  <meta name="viewport" content="width=414, initial-scale=1.0">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./home-screen-empty-89-8.css">
</head>
<body>
  <div class="screen-89-8" role="main" aria-label="Home Screen Empty">
    <!-- Create your first note ! -->
    <div class="el-91-12">
      <span>Create your first note !</span>
    </div>

    <!-- Illustration image -->
    <div class="el-111-12" role="img" aria-label="notebook illustration">
      <img src="figmaimages/figma_image_111_12.png" alt="notebook illustration" class="image-cover">
    </div>

    <!-- Hero Text Notes -->
    <div class="el-125-51">
      <span>Notes</span>
    </div>

    <!-- Button 1 background -->
    <div class="el-125-52" aria-hidden="true"></div>
    <!-- info_outline icon -->
    <div class="el-125-53" role="img" aria-label="info_outline icon">
      <img src="figmaimages/figma_image_125_53.svg" alt="info_outline" class="icon-img">
    </div>

    <!-- Button 4 background -->
    <div class="el-125-54" aria-hidden="true"></div>
    <!-- search icon -->
    <div class="el-125-55" role="img" aria-label="search icon">
      <img src="figmaimages/figma_image_125_55.svg" alt="search" class="icon-img">
    </div>

    <!-- Floating action ellipse -->
    <div class="el-89-29" aria-hidden="true"></div>
    <!-- add icon -->
    <div class="el-115-17" role="img" aria-label="add icon">
      <img src="figmaimages/figma_image_115_17.svg" alt="add" class="icon-img">
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./home-screen-empty-89-8.js"></script>
</body>
</html>
